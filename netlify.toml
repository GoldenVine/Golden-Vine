[build]
  command = "CI=false pnpm install --no-frozen-lockfile && pnpm --filter @workspace/golden-vine run build"
  publish = "artifacts/golden-vine/dist/public"
  functions = "netlify/functions"

[build.environment]
  PORT = "3000"
  BASE_PATH = "/"
  CI = "true"

[functions]
  directory = "netlify/functions"

# Return 404 for /api/* so the SPA catch-all does not swallow API calls
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 404
  force = true

# Pages that were pre-rendered are served directly; anything else gets the
# plain app shell (spa.html) and is drawn by the browser as before.
[[redirects]]
  from = "/*"
  to = "/spa.html"
  status = 200
